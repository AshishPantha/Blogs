{% extends 'blog/base.html' %}

{% block content %}
    <div class="blog">
        <h1>Blog Posts</h1>
        {% for post in posts %}
        
            <div class="post-card">
                <div class="post-header">
                    <h2><a href="{% url 'post_detail' post.pk %}">{{ post.title }}</a></h2>
                    {% if post.category %}
                        <span class="category">{{ post.category }}</span>
                    {% endif %}
                </div>

                <p>{{ post.content|truncatewords:30 }}</p>
            </div>
        {% endfor %}
    </div>
{% endblock %}
